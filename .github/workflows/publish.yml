name: Public Habr demo (verify and deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audited HTML snapshot
        run: |
          python build_demo.py --check
          python -m unittest discover -p 'test_*.py' -v
          echo "a5dbb6cc0fc73e33178d205dad4fc5f2981bde9bdadd841342c1e17e3e59b5b1  index.html" | sha256sum -c -
      - name: Install browser test dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test guided and advanced UI
        run: node browser_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-browser-evidence
          path: browser-evidence/*.png
          if-no-files-found: warn
      - name: Stage only public site files
        run: |
          mkdir -p _site/figures
          cp index.html _site/index.html
          cp figures/overview.svg figures/boundary.svg _site/figures/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify anonymously served release bytes
        shell: bash
        run: |
          set -euo pipefail
          base=https://kr13t1.github.io/ts-reliability-habr-demo/
          expected=a5dbb6cc0fc73e33178d205dad4fc5f2981bde9bdadd841342c1e17e3e59b5b1
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 "${base}?release=${GITHUB_SHA}" -o /tmp/public-index.html && echo "$expected  /tmp/public-index.html" | sha256sum -c -; then
              for figure in overview boundary; do
                curl --fail --silent --show-error --location --max-time 20 "${base}figures/$figure.svg" -o "/tmp/$figure.svg"
                grep -q '<svg' "/tmp/$figure.svg"
              done
              curl --fail --silent --show-error --location --max-time 30 'https://github.com/kr13t1/ts-reliability-habr-demo/archive/fff544b924637fc1e9be140b3ac19f7d7ee01918.zip' -o /tmp/public-source.zip
              unzip -tq /tmp/public-source.zip
              echo 'PASS anonymous HTTPS release HTML checksum, both figures and pinned public source archive'
              exit 0
            fi
            sleep 5
          done
          exit 1

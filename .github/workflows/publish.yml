name: Public Habr demo (verify and deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audited HTML snapshot
        run: |
          python build_demo.py --check
          python -m unittest discover -p 'test_*.py' -v
          echo "9d45b2f740415f19d8857beafa0cffd6150748571eb94841744cb085c200a684  index.html" | sha256sum -c -
      - name: Stage only public site files
        run: |
          mkdir -p _site/figures
          cp index.html _site/index.html
          cp figures/overview.svg figures/boundary.svg _site/figures/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
